<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        p[draggable]{
            color:red;
        }
        p[draggable="true"]{
            color:green;
        }
    </style>
</head>
<body>
    <p>Hello world this is the first line</p>
    <p draggable="false">This is the second line</p>
    <p draggable="true">This is the third line</p>
</body>
</html>
